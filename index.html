<style>
:root{
    --accent:#ff4500;
    --accent-2:#ff6a2a;
    --bg:#0a0a0a;
    --surface:#121212;
    --surface-2:#181818;
    --surface-3:#212121;
    --text:#f2f2f2;
    --text-dim:#8f8f8f;
    --border:#262626;
    --shadow:0 18px 45px rgba(0,0,0,.45);
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:var(--font-body)}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,rgba(255,69,0,.10),transparent 40%),
        repeating-linear-gradient(0deg,rgba(255,255,255,0.015) 0px,rgba(255,255,255,0.015) 1px,transparent 1px,transparent 3px),
        var(--bg);
    color:var(--text);
    transition:.25s;
}
body.light{
    --bg:#f4f4f5;
    --surface:#fff;
    --surface-2:#f7f7f7;
    --surface-3:#ececec;
    --text:#111;
    --text-dim:#666;
    --border:#e0e0e0;
    background:var(--bg);
}

/* HEADER */
.header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(10,10,10,.9);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:16px clamp(12px,3vw,34px);
}
body.light .header{background:rgba(255,255,255,.92)}

.header-inner{
    width:min(1400px,100%);
    margin:auto;
}

.top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    cursor:pointer;
    user-select:none;
}
.brand-mark{
    width:40px;height:40px;
    display:grid;place-items:center;
    border-radius:11px;
    background:linear-gradient(135deg,var(--accent),#ff8a4d);
    color:#fff;
    font-family:var(--font-display);
    font-size:18px;
    font-weight:800;
    box-shadow:0 8px 22px rgba(255,69,0,.3);
}
.brand-text{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:800;
    letter-spacing:3px;
}
.brand-text span{color:var(--accent)}
.status{
    display:flex;align-items:center;gap:6px;
    color:#4fce88;
    font-size:10px;
    font-weight:600;
    letter-spacing:1px;
    margin-top:2px;
}
.status-dot{
    width:6px;height:6px;border-radius:50%;
    background:#43d17c;
    box-shadow:0 0 10px #43d17c;
}

.actions{display:flex;gap:8px}
.icon-btn{
    width:38px;height:38px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

.search-wrap{
    display:flex;
    gap:8px;
    margin:18px auto 14px;
    max-width:820px;
}
.search-box{
    position:relative;
    flex:1;
}
.search-box i{
    position:absolute;
    left:16px;top:50%;
    transform:translateY(-50%);
    color:var(--text-dim);
    font-size:13px;
}
#search{
    width:100%;
    padding:13px 46px 13px 42px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    outline:none;
    font-size:13.5px;
    transition:.2s;
}
#search::placeholder{color:var(--text-dim)}
#search:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,69,0,.14);
}
.clear-search{
    position:absolute;
    right:9px;top:50%;
    transform:translateY(-50%);
    width:26px;height:26px;
    border:0;border-radius:50%;
    background:transparent;color:var(--text-dim);
    cursor:pointer;
    display:none;
}
.clear-search:hover{background:var(--surface-3);color:var(--text)}
.search-btn{
    padding:0 18px;
    border:0;border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.5px;
    cursor:pointer;
    transition:.2s;
}
.search-btn:hover{background:var(--accent-2);transform:translateY(-1px)}

.bar-title{
    color:var(--text-dim);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:1.2px;
    text-transform:uppercase;
    margin:10px 0 6px;
}
.scroll-bar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 0 8px;
    scrollbar-width:none;
}
.scroll-bar::-webkit-scrollbar{display:none}

.channel-btn,.category-btn{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    border-radius:999px;
    padding:8px 14px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:.2s;
}
.channel-btn:hover,.category-btn:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
}
.channel-btn.active,.category-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
}

/* MAIN */
.main{
    width:min(1400px,100%);

}
.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

}
.result-info{

    color:var(--text-dim);
}
.result-info strong{color:var(--text)}
.sort-btn{

    border-radius:9px;
    font-size:11px;

.results{

.video-card{

}

.thumb{

}
.thumb img{
    width:100%;height:100%;

.video-card:hover .thumb img{transform:scale(1.04)}
.play-overlay{

.preview-container{

.author-row{

.avatar-chip{
    width:20px;height:20px;

.author-name{color:var(--text-dim);font-size:11px}

.category-tag{

.spinner{

/* MODAL */
#modal-player{
    display:none;

.modal-content{

/* FLOATERS */
.bmc-float,#qr-btn{

.bmc-float{

#qr-btn{
    left:20px;
    padding:10px 16px;

    font-weight:700;

#qr-btn:hover{border-color:var(--accent);color:var(--accent)}
#back-to-top{

    display:none;

#back-to-top.show{display:block}

/* QR */
#qr-popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    justify-content:center;
    align-items:center;
    z-index:2000;
    padding:20px;

.qr-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--accent);

.qr-card p{font-family:var(--font-display);color:var(--accent);font-weight:700;margin-bottom:15px;font-size:13px;letter-spacing:.5px}
.qr-card img{width:min(220px,70vw);border-radius:12px}
.qr-close{
    position:absolute;

/* FOOTER */
footer{
    border-top:1px solid var(--border);
    background:var(--surface);

/* MOBILE */
@media(max-width:700px){

    .search-btn span{display:none}
}
</style>

"use strict";

let player = null;
let allVideos = [];
let filteredVideos = [];
let currentCategory = "all";
let currentChannel = "all";
let currentVideoIndex = 0;
let newestFirst = true;

const channels = [
    {id:"UC_x5XG1OV2P6uZZ5FSM9Ttw", name:"Google Devs"},
    {id:"UC29ju8bIPH5as8OGnQzwJyA", name:"Traversy Media"},
    {id:"UCWv7vMbMWH4-V0ZXdmDpPBA", name:"freeCodeCamp"},
    {id:"UCSJbGtTlrDami-tDGPUV9-w", name:"Mosh"},
    {id:"UCYO_jab_esuFRV4b17AJtAw", name:"3Blue1Brown"},
    {id:"UC1k9c0gJ1a1kDFG1V2B2GDA", name:"David Bombal"},
    {id:"UC9x0AN7BWHpCDHSm9NiJFJQ", name:"NetworkChuck"},
    {id:"UCVeW9qkBjo3zosnqUbG7CFw", name:"John Hammond"},
    {id:"UCJklo0Zl5tLV9kkk_Jd81EA", name:"Breaking Benjamin"}
];

const searchInput = document.getElementById("search");
const results = document.getElementById("results");
const resultInfo = document.getElementById("resultInfo");
const clearSearchBtn = document.getElementById("clearSearchBtn");

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function initials(name) {
    return String(name || "?").trim().charAt(0).toUpperCase();
}

function getVideoId(link) {
    try {
        const url = new URL(link);
        if(url.hostname.includes("youtube.com")) {
            return url.searchParams.get("v") ||
                   url.pathname.split("/").filter(Boolean).pop() || null;
        }
        if(url.hostname.includes("youtu.be")) {
            return url.pathname.split("/").filter(Boolean)[0] || null;
        }
    } catch(e) {}

    const match = String(link || "").match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{6,})/);
    return match ? match[1] : null;
}

function categoryFor(title, author) {
    const t = `${title} ${author}`.toLowerCase();

    if(/music|song|lyrics|official audio|concert|band|rock/.test(t)) return "music";
    if(/game|gaming|gameplay|minecraft|valorant|fortnite|steam/.test(t)) return "gaming";
    if(/tech|code|coding|program|javascript|python|linux|android|developer|network|cyber|computer|software/.test(t)) return "tech";
    if(/news|breaking|update|report/.test(t)) return "news";
    if(/learn|tutorial|course|lesson|explained|how to|guide/.test(t)) return "learning";
    return "other";
}

// channelId is now attached at fetch time (see fetchChannel) instead of guessed later.
function processVideos(items, channelId) {
    return items.map(v => ({
        ...v,
        title: String(v.title || "Untitled"),
        author: String(v.author || "Unknown channel"),
        link: String(v.link || ""),
        thumbnail: String(v.thumbnail || ""),
        category: categoryFor(v.title, v.author),
        pubDate: v.pubDate ? new Date(v.pubDate).getTime() : 0,
        channelId
    })).filter(v => getVideoId(v.link));
}

function renderChannels() {
    const box = document.getElementById("channels-buttons");

    const all = document.createElement("button");
    all.className = "channel-btn active";
    all.textContent = "All Channels";
    all.onclick = () => selectChannel("all", all);
    box.appendChild(all);

    channels.forEach(ch => {
        const btn = document.createElement("button");
        btn.className = "channel-btn";
        btn.textContent = ch.name;
        btn.onclick = () => selectChannel(ch.id, btn);
        box.appendChild(btn);
    });
}

function selectChannel(channelId, btn) {
    currentChannel = channelId;

    document.querySelectorAll(".channel-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    applyFilters();
}

document.querySelectorAll(".category-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        currentCategory = btn.dataset.category;
        document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        applyFilters();
    });
});

function showLoader(show) {
    document.getElementById("loader").style.display = show ? "block" : "none";
}

function showState(icon, title, text, buttonText = "", buttonAction = "") {
    results.innerHTML = `
        <div class="state-box">
            <i class="fas ${icon}"></i>
            <h3>${escapeHTML(title)}</h3>
            <p>${escapeHTML(text)}</p>
            ${buttonText ? `<button onclick="${buttonAction}">${escapeHTML(buttonText)}</button>` : ""}
        </div>
    `;
}

function updateSearchUI() {
    clearSearchBtn.style.display = searchInput.value ? "block" : "none";
}

function searchVideos() {
    applyFilters();
    results.scrollIntoView({behavior:"smooth",block:"start"});
}

function clearSearch() {
    searchInput.value = "";
    updateSearchUI();
    applyFilters();
    searchInput.focus();
}

searchInput.addEventListener("input", () => {
    updateSearchUI();
    applyFilters();
});

searchInput.addEventListener("keydown", e => {
    if(e.key === "Escape") clearSearch();
});

function applyFilters() {
    const query = searchInput.value.trim().toLowerCase();

    let data = allVideos.filter(v => {
        const text = `${v.title} ${v.author} ${v.category}`.toLowerCase();
        const matchesSearch = !query || text.includes(query);
        const matchesCategory = currentCategory === "all" || v.category === currentCategory;
        // Exact channel id match now that videos carry their source channelId.
        const matchesChannel = currentChannel === "all" || v.channelId === currentChannel;

        return matchesSearch && matchesCategory && matchesChannel;
    });

    data.sort((a,b) => newestFirst
        ? b.pubDate - a.pubDate
        : a.pubDate - b.pubDate
    );

    filteredVideos = data;
    displayVideos(filteredVideos);

    resultInfo.innerHTML = `<strong>${filteredVideos.length}</strong> result${filteredVideos.length === 1 ? "" : "s"}`;
    if(query) resultInfo.innerHTML += ` for <strong>"${escapeHTML(query)}"</strong>`;
}

function displayVideos(videos) {
    results.innerHTML = "";

    if(!videos.length) {
        showState(
            "fa-magnifying-glass",
            "No results found",
            "Try another keyword, category, or channel."
        );
        return;
    }

    videos.forEach((v,index) => {
        const videoId = getVideoId(v.link);
        const card = document.createElement("article");
        card.className = "video-card";
        card.tabIndex = 0;
        card.setAttribute("role","button");
        card.setAttribute("aria-label", `Play ${v.title}`);

        card.innerHTML = `
            <div class="thumb">
                <img loading="lazy" src="${escapeHTML(v.thumbnail)}" alt="${escapeHTML(v.title)}">
                <div class="preview-container">
                    <iframe class="preview-iframe"
                        width="100%" height="100%"
                        frameborder="0"
                        allow="autoplay; encrypted-media">
                    </iframe>
                </div>
                <div class="play-overlay">
                    <div class="play-circle"><i class="fas fa-play"></i></div>
                </div>
                <div class="source-badge"><i class="fab fa-youtube"></i> YouTube</div>
            </div>

            <div class="video-info">
                <div class="title-txt">${escapeHTML(v.title)}</div>
                <div class="author-row">
                    <span class="avatar-chip">${initials(v.author)}</span>
                    <span class="author-name">${escapeHTML(v.author)}</span>
                </div>
                <span class="category-tag">${escapeHTML(v.category)}</span>
            </div>
        `;

        const iframe = card.querySelector(".preview-iframe");
        let previewTimer;

        card.addEventListener("mouseenter", () => {
            previewTimer = setTimeout(() => {
                iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1&mute=1&controls=0&rel=0`;
                card.classList.add("previewing");
            }, 350);
        });

        card.addEventListener("mouseleave", () => {
            clearTimeout(previewTimer);
            iframe.src = "";
            card.classList.remove("previewing");
        });

        card.addEventListener("click", () => playVideoModal(index));
        card.addEventListener("keydown", e => {
            if(e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                playVideoModal(index);
            }
        });

        results.appendChild(card);
    });
}

async function fetchChannel(ch) {
    const url =
        `https://api.rss2json.com/v1/api.json?rss_url=` +
        encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${ch.id}`);

    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    return processVideos(data.items || [], ch.id);
}

async function loadAllChannels() {
    showLoader(true);

    try {
        // Fetch in small batches to reduce the chance of hitting rss2json's
        // free-tier rate limit when firing many requests at once.
        const batchSize = 3;
        const collected = [];
        for(let i = 0; i < channels.length; i += batchSize) {
            const batch = channels.slice(i, i + batchSize);
            const responses = await Promise.allSettled(batch.map(fetchChannel));
            responses
                .filter(r => r.status === "fulfilled")
                .forEach(r => collected.push(...r.value));
        }

        const seen = new Set();
        allVideos = collected.filter(v => {
            const id = getVideoId(v.link);
            if(seen.has(id)) return false;
            seen.add(id);
            return true;
        });

        currentChannel = "all";
        applyFilters();

        if(!allVideos.length) {
            showState(
                "fa-cloud-arrow-down",
                "No videos loaded",
                "The RSS service returned no videos. Try refreshing."
            );
        }
    } catch(e) {
        console.error(e);
        showState(
            "fa-triangle-exclamation",
            "Core sync error",
            "Unable to load the video feeds.",
            "RETRY",
            "loadAllChannels()"
        );
    } finally {
        showLoader(false);
    }
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
        playerVars:{
            rel:0,
            modestbranding:1,
            controls:1,
            fs:1,
            playsinline:1
        },
        events:{
            onStateChange:e => {
                if(e.data === YT.PlayerState.ENDED) playNext();
            }
        }
    });
}

function playVideoModal(index) {
    const v = filteredVideos[index];
    if(!v) return;

    const videoId = getVideoId(v.link);
    if(!videoId) return;

    currentVideoIndex = index;
    document.getElementById("modal-player").style.display = "flex";
    document.body.style.overflow = "hidden";

    if(player && typeof player.loadVideoById === "function") {
        player.loadVideoById(videoId);
    } else {
        document.getElementById("player").innerHTML =
            `<iframe class="fallback-player" style="width:100%;height:100%;aspect-ratio:16/9;border:0"
                src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=1&rel=0&controls=1&fs=1&playsinline=1"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen></iframe>`;
    }
}

function playNext() {
    if(currentVideoIndex + 1 < filteredVideos.length) {
        playVideoModal(currentVideoIndex + 1);
    }
}

function closePlayer() {
    document.getElementById("modal-player").style.display = "none";
    document.body.style.overflow = "";

    if(player && typeof player.stopVideo === "function") {
        player.stopVideo();
    }

    // If the YouTube IFrame API wasn't ready yet (e.g. blocked by an
    // extension, or still loading), playback used a plain fallback iframe
    // that the API player object above doesn't control. stopVideo() can't
    // touch it, so it keeps playing muted-out-of-view unless we force it.
    const fallbackFrame = document.querySelector("#player iframe.fallback-player");
    if(fallbackFrame) {
        fallbackFrame.src = "";
        fallbackFrame.remove();
    }
}

document.addEventListener("keydown", e => {
    if(e.key === "Escape") {
        closePlayer();
        closeQR();
    }
});

function toggleTheme() {
    document.body.classList.toggle("light");
    const light = document.body.classList.contains("light");
    localStorage.setItem("se7en-theme", light ? "light" : "dark");
    document.getElementById("themeIcon").className =
        light ? "fas fa-sun" : "fas fa-moon";
}

function loadTheme() {
    const theme = localStorage.getItem("se7en-theme");
    if(theme === "light") {
        document.body.classList.add("light");
        document.getElementById("themeIcon").className = "fas fa-sun";
    }
}

function toggleSort() {
    newestFirst = !newestFirst;
    document.getElementById("sortText").textContent =
        newestFirst ? "Newest" : "Oldest";
    applyFilters();
}

function openQR() {
    document.getElementById("qr-popup").style.display = "flex";
    document.body.style.overflow = "hidden";
}

function closeQR() {
    document.getElementById("qr-popup").style.display = "none";
    if(document.getElementById("modal-player").style.display !== "flex") {
        document.body.style.overflow = "";
    }
}

window.addEventListener("scroll", () => {
    document.getElementById("back-to-top")
        .classList.toggle("show", window.scrollY > 300);
});

renderChannels();
loadTheme();
loadAllChannels();
</script>
